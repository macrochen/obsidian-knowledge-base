name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Obsidian Vault
        uses: actions/checkout@v4
        with:
          path: vault
          fetch-depth: 0
      
      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy Vault to Quartz Content
        run: |
          rsync -av --exclude='.git' --exclude='.github' --exclude='.obsidian' vault/ quartz/content/
      
      - name: Configure Quartz
        working-directory: quartz
        run: |
          # Rename the title
          sed -i 's/pageTitle: "🪴 Quartz 4.0"/pageTitle: "Macrochen Knowledge Base"/g' quartz.config.ts
          # Fix the base url for github pages
          sed -i 's/baseUrl: "yoursite.com"/baseUrl: "macrochen.github.io\/obsidian-knowledge-base"/g' quartz.config.ts
          # Setup locale to zh-CN for proper date parsing if necessary
          sed -i 's/locale: "en-US"/locale: "zh-CN"/g' quartz.config.ts
          
          # Hide the messy tags in file lists via custom CSS
          echo "" >> quartz/styles/custom.scss
          echo "/* Hide tags on article lists */" >> quartz/styles/custom.scss
          echo "ul.tags { display: none !important; }" >> quartz/styles/custom.scss
      
      - name: Build Quartz
        working-directory: quartz
        run: |
          npm ci
          npx quartz build
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
